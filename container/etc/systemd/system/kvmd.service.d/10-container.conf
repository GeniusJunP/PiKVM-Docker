[Unit]
# Inside the container, /dev/kvmd-video and /dev/kvmd-hid are set up by
# pikvm-prepare and pikvm-switch rather than udev (there is no udev in
# the container). kvmd fails to start with no exception handling if it
# can't open its devices
# (kvmd/apps/kvmd/server.py's _before_app(),
# https://github.com/pikvm/kvmd/blob/v4.213/kvmd/apps/kvmd/server.py#L278;
# kvmd/apps/kvmd/ugpio.py's sysprep(),
# https://github.com/pikvm/kvmd/blob/v4.213/kvmd/apps/kvmd/ugpio.py#L311),
# and Restart=always / RestartSec=3 turns that into a crash loop every 3
# seconds. That failure mode isn't "this one target doesn't show video" —
# it's "the whole KVM is down and the WebUI won't come up either". So kvmd
# itself is not allowed to start until preparation has finished (that is,
# until at least one usable target has been confirmed).
Requires=pikvm-prepare.service
After=pikvm-prepare.service
