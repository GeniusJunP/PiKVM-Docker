# Upstream's kvmd-nginx.service has PrivateDevices=yes. That's a systemd
# feature that requires CAP_SYS_ADMIN to set up a private /dev, and this
# design's container is unprivileged (no CAP_SYS_ADMIN), so leaving it on
# can make the unit fail to start. This overrides it back off.
[Service]
PrivateDevices=no
